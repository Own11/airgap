<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirGap Dashboard</title><link rel="stylesheet" href="/static/styles.css"><style>.dashboard{padding:90px 0}.dashboard-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin:40px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div,.result{background:#e5e8df;border-radius:12px;padding:24px}.stats b{font:700 35px Space Grotesk;color:#2f86b1;display:block}.results{display:none;grid-template-columns:1fr 1fr;gap:15px;margin-top:40px}.results.open{display:grid}.result h3{margin-top:0}.result li{line-height:1.7}.exports{grid-column:1/-1;display:flex;gap:10px}.exports a{background:#102d4c;color:white;padding:12px;border-radius:5px}@media(max-width:760px){.dashboard{padding:50px 16px}.dashboard-grid,.results{grid-template-columns:1fr}}</style></head><body><header><a class="logo" href="/">◒ airgap</a><div><span id="user"></span><button id="logout" class="btn">Выйти</button></div></header><main><section class="dashboard"><label>● YOUR WORKSPACE</label><h1>Рабочее<br><i>пространство.</i></h1><div class="dashboard-grid"><div class="drop" id="drop"><input id="file" type="file" accept=".mp3,.wav,.m4a,.mp4,.webm" hidden><strong id="fileName">↑　Загрузить новую встречу</strong><small>MP3 · WAV · M4A · MP4 · WebM</small><button id="send" class="btn" disabled>Обработать ↗</button><output id="status"></output></div><div class="stats"><div><b id="count">0</b><span>Встреч всего</span></div><div><b>AI</b><span>Аналитика</span></div><div><b>3</b><span>Языка</span></div></div></div><h2>Ваши встречи</h2><div id="meetings">Загрузка...</div><div id="results" class="results"><div class="result"><h3>Executive Summary</h3><p id="summary"></p></div><div class="result"><h3>Решения</h3><ul id="decisions"></ul></div><div class="result"><h3>Action Items</h3><ul id="actions"></ul></div><div class="result"><h3>Риски и блокеры</h3><ul id="risks"></ul></div><div class="exports"><a id="json-export">JSON ↓</a><a id="csv-export">CSV ↓</a><a id="pdf-export">PDF ↓</a></div></div></section></main><script src="/static/dashboard.js"></script></body></html>
<style>.chat-box{grid-column:1/-1}.chat-box input{width:70%;padding:13px;border:1px solid #ccd5d3;border-radius:5px;margin-right:8px}.chat-box .btn{margin:0}.chat-box p{white-space:pre-wrap}</style>
